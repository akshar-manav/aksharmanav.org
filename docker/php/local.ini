; Local development defaults. Production PHP settings require a separate review.
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
max_input_vars = 5000
display_errors = On
display_startup_errors = On
log_errors = On
session.cookie_httponly = 1
session.cookie_samesite = Lax
